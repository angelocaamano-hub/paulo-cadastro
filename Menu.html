<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caamano Adoções</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      /* Fundo profissional com gradiente suave e padrão discreto */
      background-color: #eef2f5;
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 126, 95, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(44, 62, 80, 0.08) 0px, transparent 50%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%232c3e50' fill-opacity='0.03' fill-rule='evenodd'%3E%3Cpath d='M30 30c0-5.523 4.477-10 10-10s10 4.477 10 10-4.477 10-10 10-10-4.477-10-10zm-10 0c0-5.523-4.477-10-10-10S0 24.477 0 30s4.477 10 10 10 10-4.477 10-10z'/%3E%3C/g%3E%3C/svg%3E");
      color: #222222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container principal */
    .card-container {
      background-color: #ffffff;
      max-width: 600px;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

    .card-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.12);
    }

    .hero-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 35px 30px;
    }

    h1 {
      color: #1a252f;
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    p.description {
      color: #333333;
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    p.instructions {
      color: #555555;
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .btn-adopt {
      display: inline-block;
      background: linear-gradient(135deg, #e65c00, #f9d423);
      color: #ffffff;
      padding: 16px 32px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(230, 92, 0, 0.3);
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-adopt:hover {
      background: linear-gradient(135deg, #f9d423, #e65c00);
      box-shadow: 0 6px 20px rgba(230, 92, 0, 0.5);
      transform: scale(1.03);
    }

    /* Acessibilidade: foco visível para navegação por teclado */
    .btn-adopt:focus,
    a:focus {
      outline: 4px solid #0056b3;
      outline-offset: 4px;
    }

    a {
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>

<body>

  <main class="card-container">
    <img class="hero-img" src="loja_foto.jpg" alt="Foto da fachada da loja Caamano Adoções com animais">
    
    <div class="content">
      <h1>Caamano Adoções</h1>
      <p class="description">
        Em nosso site mostramos os animais que estão esperando por famílias que possam dar todo o carinho e amor.
      </p>
      <p class="instructions">
        Para mais informações e para adotar um pet, clique abaixo e comece seu cadastro!
      </p>

      <a href="Cachorros_em_adoção.html" aria-label="Cadastrar-se para adotar um pet">
        <button class="btn-adopt" type="button">Cadastre-se para adotar seu futuro pet</button>
      </a>
    </div>
  </main>

  <!-- Widget VLibras para pessoas surdas ou com deficiência auditiva -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

</body>
</html>
