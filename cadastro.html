<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro para Adoção - Caamano Adoções</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #eef2f5;
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 126, 95, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(44, 62, 80, 0.08) 0px, transparent 50%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%232c3e50' fill-opacity='0.03' fill-rule='evenodd'%3E%3Cpath d='M30 30c0-5.523 4.477-10 10-10s10 4.477 10 10-4.477 10-10zm-10 0c0-5.523-4.477-10-10-10S0 24.477 0 30s4.477 10 10 10 10-4.477 10-10z'/%3E%3C/g%3E%3C/svg%3E");
      color: #222222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

   
    .container {
      max-width: 480px;
      width: 100%;
      background-color: #ffffff;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }

   
    .accessibility-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 20px;
      background-color: #f8f9fa;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #e9ecef;
    }

    .accessibility-bar span {
      font-size: 14px;
      color: #555555;
      font-weight: 500;
      margin-right: auto;
    }

    .btn-font {
      background-color: #2c3e50;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-font:hover {
      background-color: #1a252f;
    }

    h2 {
      text-align: center;
      color: #1a252f;
      font-size: 1.75em;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333333;
      font-weight: 600;
      font-size: 1em;
    }

    input, select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.95em;
      color: #333333;
      background-color: #fafafa;
      transition: all 0.3s ease;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #ff7e5f;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 126, 95, 0.2);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #e65c00, #f9d423);
      color: #ffffff;
      padding: 15px;
      border: none;
      border-radius: 50px;
      font-size: 1.05em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(230, 92, 0, 0.3);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #f9d423, #e65c00);
      box-shadow: 0 6px 20px rgba(230, 92, 0, 0.5);
      transform: translateY(-2px);
    }

    .voltar {
      display: inline-block;
      width: 100%;
      text-align: center;
      margin-top: 20px;
      color: #555555;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9em;
    }

    .voltar:hover {
      color: #e65c00;
      text-decoration: underline;
    }

    button:focus,
    a:focus {
      outline: 3px solid #0056b3;
      outline-offset: 3px;
    }
  </style>
</head>

<body>

  <main class="container" id="conteudo-principal">
    
 
    <div class="accessibility-bar" aria-label="Controle de tamanho de texto">
      <span>Tamanho do texto:</span>
      <button type="button" class="btn-font" onclick="alterarFonte(-2)" aria-label="Diminuir fonte">A-</button>
      <button type="button" class="btn-font" onclick="resetarFonte()" aria-label="Tamanho padrão">A</button>
      <button type="button" class="btn-font" onclick="alterarFonte(2)" aria-label="Aumentar fonte">A+</button>
    </div>

    <h2>Cadastro para Adoção</h2>

    <form action="final.html" method="GET">
      
      <div class="form-group">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label for="telefone">Telefone / WhatsApp:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 90000-0000" required>
      </div>

      <div class="form-group">
        <label for="pet">Qual pet deseja adotar?</label>
        <select id="pet" name="pet" required>
          <option value="">Selecione um animal...</option>
          <option value="Cachorro">Cachorro</option>
          <option value="Gato">Gato</option>
          <option value="Periquito">Periquito</option>
          <option value="Outro">Outro Pet</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Finalizar Cadastro</button>
    </form>

    <a href="Menu.html" class="voltar">← Voltar para a página inicial</a>

  </main>
<!-- Widget VLibras -->
  
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');

    
    let tamanhoAtual = 16;
    const tamanhoMinimo = 12;
    const tamanhoMaximo = 24;

    function alterarFonte(valor) {
      tamanhoAtual += valor;

      if (tamanhoAtual < tamanhoMinimo) tamanhoAtual = tamanhoMinimo;
      if (tamanhoAtual > tamanhoMaximo) tamanhoAtual = tamanhoMaximo;

      const container = document.getElementById('conteudo-principal');
      container.style.fontSize = tamanhoAtual + 'px';
    }

    function resetarFonte() {
      tamanhoAtual = 16;
      const container = document.getElementById('conteudo-principal');
      container.style.fontSize = '16px';
    }
  </script>

</body>
</html>
